# Cassette gap allowlist.
#
# Write-tools listed here are KNOWN to lack an integration cassette against
# the real Octopus API. Each entry explains why and what makes recording one
# non-trivial.
#
# This is technical debt. Each entry should ideally be moved to
# tool_cassette_coverage.yml when:
#   - The tool is touched (any code change should include a cassette)
#   - We do a focused "fill cassette gaps" effort
#
# The cassette_coverage_spec.rb audit makes this allowlist load-bearing:
# a new write-tool in manifest.json that's neither covered nor allowlisted
# will fail the audit. This means new write-tools cannot be merged without
# either a cassette or an explicit allowlist entry with a reason.

