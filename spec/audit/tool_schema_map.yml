# ---------------------------------------------------------------------------
# Payments and envelopes
# ---------------------------------------------------------------------------

add_invoice_to_payment_list:
  schema: BankDocumentServiceData
  http_method: post
  url_fragment: /bank/paymentlist
  sample_params:
    bookyear_id: 1
    journal_key: "A1"
    document_sequence_nr: 1
    amount: 100.0
    reference: "PAY-001"

add_free_payment:
  schema: AddFreePaymentRequest
  http_method: post
  url_fragment: /bank/paymentlist/freepayment
  pending: true
  pending_reason: |
    Tool missing REQUIRED `date` and `payDate` fields. Schema requires both.
    TODO: add date + pay_date params to tool, include them in build_data.
  sample_params:
    amount: 100.0
    reference: "FREE-001"
    iban: "BE68539007547034"
    relation_id: 1

create_envelope:
  schema: NewEnveloppeRequest
  http_method: post
  url_fragment: /bank/enveloppes
  pending: true
  pending_reason: |
    Tool sends only `description` (not in schema). Schema REQUIRES bookyearKey
    + journalKey, and optionally payDate + status.
    TODO: rewrite tool interface — add bookyear_id and journal_key params,
    drop description (not supported by API for envelopes).
  sample_params:
    description: "Test envelope"
    payment_date: "2024-03-15"
    journal_key: "F1"

update_envelope:
  schema: UpdateEnveloppeRequest
  http_method: put
  url_fragment: /bank/enveloppes/
  pending: true
  pending_reason: |
    Tool sends `description` which is not in UpdateEnveloppeRequest schema
    (schema has only journalKey, payDate, status).
    TODO: remove description from build_data, expose journal_key/pay_date/status
    in tool input_schema.
  sample_params:
    envelope_key_id: 1
    description: "Updated envelope"
    payment_date: "2024-03-20"

add_payment_to_envelope:
  schema: BankPaymentServiceData
  http_method: post
  url_fragment: /bank/enveloppes/
  url_fragment_extra: /add
  pending: true
  pending_reason: |
    Tool sends flat `paymentListKeyId` integer. Schema REQUIRES
    `bankPaymentListKey` as nested object {id: ...}.
    TODO: trivial fix — wrap the id in {bankPaymentListKey: {id: ...}}.
  sample_params:
    envelope_key_id: 1
    payment_list_key_id: 1
    amount: 100.0
    reference: "PAY-001"

remove_payment_from_envelope:
  schema: BankPaymentServiceData
  http_method: post
  url_fragment: /bank/enveloppes/
  url_fragment_extra: /remove
  pending: true
  pending_reason: |
    Same as add_payment_to_envelope: paymentListKeyId vs bankPaymentListKey.
    TODO: trivial fix.
  sample_params:
    envelope_key_id: 1
    payment_list_key_id: 1
    amount: 100.0
    reference: "PAY-001"

# ---------------------------------------------------------------------------
# Bookyear lifecycle
# ---------------------------------------------------------------------------

create_bookyear:
  schema: BookyearInsertRequest
  http_method: post
  url_fragment: /bookyears
  pending: true
  pending_reason: |
    Tool sends description + currencyCode, neither in schema. Schema requires
    names (array), bookingPeriodType, declarantType, fromDate, toDate,
    proRataTemporis. Many other optional booleans (activateDbaNp, ...).
    TODO: significant rewrite of tool. Bookyear creation is dossier-altering,
    requires careful design.
  sample_params:
    description: "Boekjaar 2024"
    from_date: "2024-01-01"
    to_date: "2024-12-31"
    periods: 12

update_bookyear:
  schema: BookyearUpdateRequest
  http_method: put
  url_fragment: /bookyears
  pending: true
  pending_reason: |
    Tool sends `description` (not in schema). Schema has `names` (array),
    plus various optional booleans matching create_bookyear.
    TODO: replace description with names array in tool interface.
  sample_params:
    bookyear_id: 1
    description: "Boekjaar 2024 (gewijzigd)"

book_bookyear:
  schema: BookBookyearRequest
  http_method: post
  url_fragment: /bookyears/book
  pending: true
  pending_reason: |
    Tool sends `fromBookyearId` and `toBookyearId` (neither in schema).
    Schema REQUIRES `bookyearKey: {id: ...}` only — bookyear is booked to
    the NEXT bookyear automatically. Optional: copyAllAccountDescriptions,
    closeSourceBookyear (booleans).
    TODO: rewrite tool interface to take a single bookyear_id and the booleans.
  sample_params:
    from_bookyear_id: 1
    to_bookyear_id: 2

# ---------------------------------------------------------------------------
# Write-tools that POST/PUT but with NO request body (only query params or
# path params). Audit skips these (nothing to validate body-wise).
# ---------------------------------------------------------------------------

tools_without_body:
  - book_invoices
  - generate_invoice
  - generate_delivery_note
