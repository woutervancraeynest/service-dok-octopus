# Tool → Octopus schema mapping for schema conformance audit.
#
# For each MCP write-tool, this map declares:
#   - schema:        the OpenAPI component name the wire body should match
#   - http_method:   the HTTP method the gem ultimately uses
#   - url_fragment:  a substring matched against the request URL for stubbing
#   - sample_params: realistic input that the tool must accept and translate
#                    into a valid body
#
# Tools that POST/PUT with NO body (only query params) are listed under
# "tools_without_body" and skipped by the audit.
#
# When you add a new write-tool to manifest.json, add it here too — the audit
# will fail otherwise.

# ---------------------------------------------------------------------------
# Master data (upserts)
# ---------------------------------------------------------------------------

create_relation:
  schema: RelationServiceData
  http_method: put
  url_fragment: /relations
  sample_params:
    name: "Test Relation BV"
    client: true
    supplier: false
    vat_number: "BE0123456789"
    email: "test@example.be"
    street_and_nr: "Teststraat 1"
    postal_code: "1000"
    city: "Brussel"
    country: "BE"
    iban: "BE68539007547034"
    currency_code: "EUR"

create_or_update_account:
  schema: AccountServiceData
  http_method: put
  url_fragment: /accounts
  pending: true
  pending_reason: |
    Tool sends a fundamentally different shape than AccountServiceData expects:
    - sends bookyearKey at root (schema: nested inside accountKey)
    - sends accountKey as integer (schema: AccountKey object {bookyearKey, id})
    - sends description1/description2 (schema: description as StringServiceData
      multi-language object)
    - sends vatCode (schema: purchaseVatCode + salesVatCode separately)
    - sends costCentreRequired boolean (schema: costCentreType integer 0/1/2)
    - sends blocked (not in schema)
    TODO: rewrite build_account_data + update tool input_schema. May need a
    live-test to confirm what Octopus actually accepts before changing.
  sample_params:
    bookyear_id: 1
    account_key: 600000
    description1: "Test account"
    description2: "Secondary"
    vat_code: "21"
    cost_centre_required: false
    blocked: false

create_or_update_cost_centre:
  schema: CostCentreServiceData
  http_method: put
  url_fragment: /costcentres
  pending: true
  pending_reason: |
    Schema requires description as StringServiceData (multi-language object
    {description_NL, description_FR, ...}) but tool sends a plain string.
    Schema also requires `closed` and `costCentreKey` as objects.
    TODO: rewrite build_cost_centre_data + update tool input_schema.
  sample_params:
    description: "Test cost centre"
    cost_centre_id: 1
    closed: false

create_or_update_product:
  schema: ProductServiceData
  http_method: put
  url_fragment: /products
  pending: true
  pending_reason: |
    Tool body misses ALL required ProductServiceData fields:
    active, code, currencyCode, defaultBookingAccountNr, priceVatExclusive,
    priceVatInclusive, productKey, unit, vatCode.
    Also: schema names are camelCase but different (priceVatExclusive vs
    unitPrice; defaultBookingAccountNr vs bookingAccountNr; active vs blocked).
    code and description need to be StringServiceData (multi-lang).
    TODO: full rewrite of build_product_data + tool input_schema.
  sample_params:
    description: "Test product"
    product_id: 1
    external_product_nr: "P001"
    unit_price: 10.0
    unit: "pcs"
    vat_code: "21"
    booking_account_nr: 700000
    blocked: false

