send_invoices:
  schema: SendInvoiceRequest
  http_method: post
  url_fragment: /invoices/send
  pending: true
  pending_reason: |
    Field-name and shape mismatches with SendInvoiceRequest:
    - tool sends `bookyearId` int, schema requires `bookyearKey` object
    - tool sends `journalKey`, schema requires `journal`
    - tool sends `fromDocumentSequenceNr`, schema requires `documentSequenceNr`
    - tool missing REQUIRED `fromMailAddress`
    TODO: rename fields in build_send_data and add fromMailAddress input.
    This tool sends real emails — careful live testing required.
  sample_params:
    bookyear_id: 1
    journal_key: "V1"
    from_document_sequence_nr: 1
    to_document_sequence_nr: 1

